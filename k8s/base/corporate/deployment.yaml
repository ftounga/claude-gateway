apiVersion: apps/v1
kind: Deployment
metadata:
  name: corporate-site
  labels:
    app: corporate-site
# Site vitrine de l'éditeur sur www.ng-itconsulting.com (F-29 SF-29-04).
# Contenu statique : un seul réplica suffit. Déploiement distinct de l'application,
# afin qu'une indisponibilité de la vitrine n'affecte pas le portail, et inversement.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corporate-site
  template:
    metadata:
      labels:
        app: corporate-site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          # Ressources bornées : un pod non borné pourrait évincer des pods applicatifs.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: content
          configMap:
            name: corporate-site-content
        - name: nginx-config
          configMap:
            name: corporate-site-nginx
