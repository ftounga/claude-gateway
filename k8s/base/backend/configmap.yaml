apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  SPRING_PROFILES_ACTIVE: "staging"
  SERVER_PORT: "8080"
  S3_REGION: "eu-west-3"
  S3_PATH_STYLE_ACCESS: "false"
  APP_FRONTEND_URL: "https://portal.ng-itconsulting.com"
  # Fournisseurs réels activés (retrait des bouchons). OCR via AWS Textract (bucket = secret
  # S3_BUCKET, droits via IRSA claude-gateway-backend-staging-irsa) ; embeddings RAG `local`
  # (in-process, sans clé ni réseau) + stockage pgvector (colonne chunks.embedding déjà en base) ;
  # e-mail SMTP réel (config spring.mail.* depuis les secrets MAIL_*).
  APP_OCR_PROVIDER: "textract"
  APP_RAG_EMBEDDING_PROVIDER: "local"
  APP_RAG_VECTOR_STORE: "pgvector"
  APP_EMAIL_PROVIDER: "smtp"
  # Atelier / Claude Code Lite (F-28) : stockage des workspaces sur S3 (bucket S3_BUCKET, préfixe
  # atelier/) pour la persistance entre redémarrages. Défaut `in-memory` réservé aux tests.
  APP_ATELIER_STORAGE: "s3"
  # F-38 — Registre des connexions runner. `pg-notify` est OBLIGATOIRE dès qu'il peut y avoir plus
  # d'un pod : l'HPA de ce déploiement va jusqu'à 4 replicas. Avec le défaut `in-memory`,
  # `findRemote()` rend toujours vide et le relais inter-pods de SF-38-12/13 reste INERTE — le mode
  # RUNNER retomberait sur `runner_not_on_this_node` dès le second pod, comme avant le relais.
  APP_RUNNER_REGISTRY: "pg-notify"
  # F-38 — Chemin du fat-jar du runner dans l'image (empaqueté par backend/Dockerfile). Sans lui,
  # `GET /runner/download` répond 404 et le bouton de téléchargement de l'écran d'appairage échoue.
  APP_RUNNER_JAR_PATH: "/app/claude-runner.jar"
  # Phase 2 Atelier (Managed Agents / exécution de code, ADR-013) : activée. L'accès reste gardé
  # par offre Gold/ADMIN (SF-28-06) et la session est éphémère (runtime borné). ⚠️ Ouvrir aux
  # abonnés Gold au-delà de l'admin nécessite les plafonds de dépense de SF-28-12.
  APP_ATELIER_AGENT_ENABLED: "true"
  # Délégation à des sous-agents (F-35) COUPÉE. Constaté en production le 2026-08-29 : l'API répond
  # `400 invalid_request_error — Failed to parse request body: unknown field "multiagent"`. Le champ
  # est accepté à la CRÉATION de l'agent (`POST /v1/agents` → 200, vérifié) mais PAS dans la surcharge
  # de session `agent_with_overrides`, où SF-35-01 le pose. Comme le flag est activé par défaut, la
  # création de session échouait pour TOUT projet — d'archive comme Git. Ce réglage rétablit l'Atelier
  # en attendant que la délégation soit portée sur la définition de l'agent.
  APP_ATELIER_AGENT_SUBAGENTS_ENABLED: "false"
  # Limites d'import ZIP Atelier — profil « généreux » (import de gros monorepos/assets).
  # Chaîne cohérente : ingress 155m >= Spring max-request 155MB >= max-file 150MB ; garde-fous
  # anti-zip-bomb sur le décompressé (total/par-fichier/nb-entrées). Purement configurable (réversible).
  APP_UPLOAD_MAX_FILE_SIZE: "150MB"
  APP_UPLOAD_MAX_REQUEST_SIZE: "155MB"
  APP_ATELIER_MAX_TOTAL_BYTES: "419430400"   # 400 Mo décompressé
  APP_ATELIER_MAX_FILE_BYTES: "20971520"     # 20 Mo par fichier
  APP_ATELIER_MAX_ENTRIES: "8000"
  # URLs de retour Stripe Checkout (F-09/F-21) : après paiement/annulation, retour sur la prod
  # (et non localhost). Non secret.
  STRIPE_SUCCESS_URL: "https://portal.ng-itconsulting.com/billing?checkout=success"
  STRIPE_CANCEL_URL: "https://portal.ng-itconsulting.com/billing?checkout=cancel"
