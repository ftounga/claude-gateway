apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claude-gateway-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claude-gateway-backend
  # F-118 / SF-118-02 (2026-09-14) : min 2 — la charge est I/O (attente reseau modele),
  # un pod peut saturer ses 32 flux SSE sans monter en CPU ; le seuil CPU seul ne suffit pas a scaler.
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
