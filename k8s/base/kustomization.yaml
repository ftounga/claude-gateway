apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend/configmap.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  # Service headless du relais interne entre pods (F-38 / SF-38-12) — port 8081, aucun Ingress.
  - backend/service-internal.yaml
  - backend/hpa.yaml
  - backend/pdb.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - frontend/pdb.yaml
  # Rendu des diagrammes côté cluster (F-142 / SF-142-06) — pour que le poste du client n'installe
  # rien. Service ClusterIP : appelé par la gateway, jamais exposé hors du cluster, aucun Ingress.
  - diagram-renderer/deployment.yaml
  - ingress/ingress.yaml
  # Site vitrine de l'éditeur — www.ng-itconsulting.com (F-29 SF-29-04)
  - corporate/configmap.yaml
  - corporate/nginx-config.yaml
  - corporate/deployment.yaml
  - corporate/service.yaml
  - ingress/corporate-ingress.yaml
