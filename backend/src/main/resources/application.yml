spring:
  application:
    name: claude-gateway-backend
  profiles:
    active: dev
  mail:
    # SMTP transactionnel (vérification d'adresse, reset mot de passe). Actif seulement si
    # MAIL_HOST est fourni par l'environnement (secrets legalcase réutilisés) ; sinon aucune
    # autoconfiguration JavaMailSender et l'e-mail retombe sur le provider `logging` (dev).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  servlet:
    multipart:
      # Plafonds de téléversement (F-04). Alignés sur app.upload.max-size (défaut 32 Mo) ; la marge
      # de la requête couvre l'enrobage multipart. Au-delà => 413 (MaxUploadSizeExceededException).
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:32MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:33MB}
server:
  port: 8080
  servlet:
    context-path: /api
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
app:
  # URL du frontend, utilisée pour construire les liens d'e-mail (vérification, reset) et
  # la redirection post-connexion OAuth.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  email:
    # Fournisseur d'e-mail : `logging` par défaut (dev/tests, journalise le lien sans SMTP) ;
    # `smtp` en prod (SmtpEmailService via JavaMailSender, config spring.mail.* ci-dessus).
    provider: ${APP_EMAIL_PROVIDER:logging}
    # Adresse expéditeur (From) des e-mails transactionnels. Réutilise MAIL_FROM (secret legalcase).
    from: ${MAIL_FROM:no-reply@ng-itconsulting.com}
  admin:
    # Super-admin (F-20) : cet e-mail est autorisé sur l'API admin et promu ADMIN au démarrage.
    super-admin-email: ${SUPER_ADMIN_EMAIL:ntounga@gmail.com}
  upload:
    # Liste blanche des types MIME acceptés (types supportés par Claude) et plafond de taille (F-04).
    # Décision réversible : ajustable sans changement de code.
    allowed-types: ${APP_UPLOAD_ALLOWED_TYPES:application/pdf,image/png,image/jpeg,image/gif,image/webp,text/plain,text/markdown,text/csv}
    max-size: ${APP_UPLOAD_MAX_SIZE:32MB}
  atelier:
    # Atelier / Claude Code Lite (F-28). Stockage `in-memory` par défaut (dev/tests, sans S3) ;
    # `s3` en cluster (bucket applicatif). Garde-fous zip-bomb : total/nb-fichiers/taille-fichier.
    storage: ${APP_ATELIER_STORAGE:in-memory}
    bucket: ${S3_BUCKET:}
    prefix: ${APP_ATELIER_PREFIX:atelier/}
    max-total-bytes: ${APP_ATELIER_MAX_TOTAL_BYTES:52428800}
    max-entries: ${APP_ATELIER_MAX_ENTRIES:2000}
    max-file-bytes: ${APP_ATELIER_MAX_FILE_BYTES:2097152}
    agent:
      # Managed Agents (F-28 / Phase 2, ADR-013). Flag OFF par défaut : tant que `enabled` est faux
      # et qu'aucune config n'existe, AUCUN appel réseau ni coût runtime (bootstrap inerte).
      enabled: ${APP_ATELIER_AGENT_ENABLED:false}
      environment-name: ${APP_ATELIER_AGENT_ENV_NAME:claude-gateway-atelier}
      agent-name: ${APP_ATELIER_AGENT_NAME:claude-gateway-atelier}
      model: ${APP_ATELIER_AGENT_MODEL:claude-opus-5}
      # Effort de raisonnement (F-28 SF-28-17) : low | medium | high | xhigh | max.
      # `xhigh` etait deja le reglage effectif (defaut de la plateforme) ; il est desormais CHOISI,
      # et modifiable sans re-provisionner l'agent — le modele et l'effort sont envoyes en surcharge
      # de session. Le baisser se decide sur les mesures de cout (F-36), pas sur une intuition.
      effort: ${APP_ATELIER_AGENT_EFFORT:xhigh}
      # Releve de consommation PENDANT le run (F-30 / SF-30-13) : alimente la ligne vivante du
      # terminal. Intervalle MINIMAL entre deux appels — le polling des events tourne bien plus vite,
      # y accrocher un releve multiplierait les requetes pour un chiffre qui n'a d'interet qu'a
      # l'echelle de la seconde. `0` desactive le releve : aucun appel, flux identique a avant.
      progress-interval: ${APP_ATELIER_AGENT_PROGRESS_INTERVAL:PT5S}
      allow-package-managers: ${APP_ATELIER_AGENT_ALLOW_PKG:true}
      # Garde-fous des sessions (SF-28-09) : bornent le nb de fichiers montés et le runtime facturé.
      max-session-files: ${APP_ATELIER_AGENT_MAX_SESSION_FILES:300}
      session-timeout: ${APP_ATELIER_AGENT_SESSION_TIMEOUT:PT10M}
      max-polls: ${APP_ATELIER_AGENT_MAX_POLLS:600}
      poll-delay: ${APP_ATELIER_AGENT_POLL_DELAY:PT1S}
      # Borne de la sortie d'outil relayee au frontend (F-30 SF-30-01) : au-dela, troncature avec
      # mention du volume omis. Un `npm install` saturerait sinon le flux SSE et le navigateur.
      max-tool-output-chars: ${APP_ATELIER_AGENT_MAX_TOOL_OUTPUT:10000}
      # Borne de la transcription persistee dans l'historique (F-30 SF-30-09) : au-dela, les blocs
      # excedentaires sont omis (mention explicite). Evite qu'un `npm install` gonfle l'historique.
      max-transcript-chars: ${APP_ATELIER_AGENT_MAX_TRANSCRIPT:100000}
      # Borne du fichier d'instructions du projet injecte a l'ouverture de session (F-34 SF-34-01) :
      # au-dela, troncature avec mention. Evite qu'un CLAUDE.md demesure mange le contexte utile.
      max-instructions-chars: ${APP_ATELIER_AGENT_MAX_INSTRUCTIONS:20000}
      # Delai laisse a l'utilisateur pour autoriser ou refuser une commande (F-33 SF-33-02). Passe ce
      # delai la commande est REFUSEE : le silence ne vaut pas autorisation. Le bac a sable reste
      # reserve (et facture) pendant l'attente, d'ou une borne courte.
      confirm-timeout: ${APP_ATELIER_AGENT_CONFIRM_TIMEOUT:PT2M}
      # Delegation de sous-taches (F-35 SF-35-01). ACTIVEE par defaut (revision D1 du
      # 2026-08-26) : les sous-agents sont des THREADS de la meme session — un seul conteneur,
      # aucune multiplication du cout de bac a sable, et le budget de session (F-36) les borne
      # tous a la fois. Le flag reste pour couper sans redeployer si l'usage revele une derive.
      # `max-subagents` borne le PARALLELISME, pas la depense (c'est le budget qui la borne).
      subagents-enabled: ${APP_ATELIER_AGENT_SUBAGENTS_ENABLED:true}
      max-subagents: ${APP_ATELIER_AGENT_MAX_SUBAGENTS:3}
      diff:
        # Diff des modifications d'un tour (F-37 / SF-37-01). `max-lines` borne le diff PAR FICHIER
        # (decision D3 du cadrage) : au-dela, troncature avec mention du volume omis — un fichier
        # genere entierement reecrit produirait des milliers de lignes que personne ne lit.
        # `max-files` borne le NOMBRE de fichiers decrits dans un tour : les suivants restent reecrits
        # et listes dans les fichiers modifies, sans diff, pour ne pas faire gonfler sans limite le
        # document du tour (qui porte deja la transcription).
        max-lines: ${APP_ATELIER_AGENT_MAX_DIFF_LINES:400}
        max-files: ${APP_ATELIER_AGENT_MAX_DIFF_FILES:50}
      cost:
        # Plafond de depense d'une session (F-36 / SF-36-01) : verrou PRE-requete pose a la creation
        # de la session. Le pire cas d'un run passe d'illimite a `max-run-cost`. Valeurs commerciales
        # reversibles, ajustables par environnement sans changement de code. Aucun secret.
        # Montants en DOLLARS (devise des tarifs publics du fournisseur).
        max-run-cost: ${APP_ATELIER_AGENT_MAX_RUN_COST:2.00}
        # Plafond majore quand la delegation a des sous-agents est active (F-35 SF-35-01) : une
        # session qui delegue mene plusieurs travaux de front. Toujours borne par le quota restant.
        max-run-cost-delegated: ${APP_ATELIER_AGENT_MAX_RUN_COST_DELEGATED:5.00}
        # Plancher : une session au budget nul serait refusee par le fournisseur (ou mise en pause
        # avant le premier mot). Borne le depassement possible du quota a quelques centimes.
        min-run-cost: ${APP_ATELIER_AGENT_MIN_RUN_COST:0.10}
        # Cout de reference du fournisseur (USD par million de tokens, blended Opus). Sert a convertir
        # le quota restant en dollars pour en deduire le plafond de la session.
        cost-per-million-tokens: ${APP_ATELIER_AGENT_COST_PER_M:9.00}
        # Multiplicateur applique au cout reel lors du decompte du quota (F-36 / SF-36-02).
        # 1.0 = NEUTRE : les allocations de tokens par plan embarquent deja la marge commerciale
        # (GOLD : 199 EUR pour 12 M tokens ~ 2x le cout blended). Le porter a 2.0 doublerait la
        # vitesse de consommation du quota de chaque client — levier de marge, a actionner sciemment.
        markup: ${APP_ATELIER_AGENT_COST_MARKUP:1.0}
  ocr:
    # Pipeline OCR (F-05). Fournisseur `stub` par défaut (dev/tests, sans AWS) ; `textract` en cluster.
    # Liste blanche MIME, plafond de taille et routage sync/async : décisions réversibles (config).
    provider: ${APP_OCR_PROVIDER:stub}
    max-size: ${APP_OCR_MAX_SIZE:20MB}
    allowed-types: ${APP_OCR_ALLOWED_TYPES:application/pdf,image/png,image/jpeg,image/tiff}
    sync-types: ${APP_OCR_SYNC_TYPES:image/png,image/jpeg}
    polling:
      # Worker intra-backend de complétion des jobs OCR asynchrones (PDF/TIFF) — SF-05-02.
      # Décision par défaut OQ-10 (réversible : workers dédiés + file en V2).
      enabled: ${APP_OCR_POLLING_ENABLED:true}
      interval: ${APP_OCR_POLLING_INTERVAL:15000}
    textract:
      # Accès AWS via chaîne de credentials par défaut (IRSA) — aucun secret en dur ni journalisé.
      # Le bucket S3 est requis pour l'OCR asynchrone (PDF/TIFF) ; absent => async indisponible.
      region: ${APP_OCR_TEXTRACT_REGION:eu-west-3}
      # Bucket S3 pour l'OCR asynchrone (PDF/TIFF). Réutilise le bucket applicatif legalcase
      # (secret S3_BUCKET) si APP_OCR_TEXTRACT_S3_BUCKET n'est pas explicitement fourni.
      s3-bucket: ${APP_OCR_TEXTRACT_S3_BUCKET:${S3_BUCKET:}}
      s3-prefix: ${APP_OCR_TEXTRACT_S3_PREFIX:ocr-inbound/}
  rag:
    # Ingestion RAG (F-06). Stockage vectoriel `noop` par défaut (dev/tests/H2 : pas de colonne
    # vector) ; `pgvector` en cluster (Postgres + extension vector, migration 002/011). Décision
    # réversible : ajustable sans changement de code.
    vector-store: ${APP_RAG_VECTOR_STORE:noop}
    chunk:
      # Découpage : ~400 « tokens » (mots approximés) / overlap 50 (mini-spec F-06). Réversible.
      max-tokens: ${APP_RAG_CHUNK_MAX_TOKENS:400}
      overlap-tokens: ${APP_RAG_CHUNK_OVERLAP_TOKENS:50}
    ingestion:
      # Worker intra-backend d'auto-indexation des documents EXTRACTED — SF-06-02.
      # Décision par défaut OQ-10 (réversible : workers dédiés + file en V2), aligné sur OcrPollingWorker.
      enabled: ${APP_RAG_INGESTION_ENABLED:true}
      interval: ${APP_RAG_INGESTION_INTERVAL:20000}
    ask:
      # Q&A documentaire (F-07). Nombre de chunks de contexte récupérés par défaut (borné [1,20]) et
      # taille des extraits de citation. Décisions réversibles, ajustables sans changement de code.
      top-k: ${APP_RAG_ASK_TOP_K:5}
      snippet-max-chars: ${APP_RAG_ASK_SNIPPET_MAX_CHARS:240}
    embedding:
      # Fournisseur d'embeddings : `stub` par défaut (déterministe, sans réseau) ; `local` (F-15) pour
      # un vectoriseur lexical in-process SANS clé ni réseau (suppression de la dépendance fournisseur) ;
      # `api` pour un fournisseur HTTP OpenAI-compatible. La clé provient EXCLUSIVEMENT de l'environnement,
      # jamais commitée ni journalisée. Dimension 1536 (OQ-01, défaut) = type `chunks.embedding vector(1536)`.
      provider: ${APP_RAG_EMBEDDING_PROVIDER:stub}
      dimension: ${APP_RAG_EMBEDDING_DIMENSION:1536}
      api-key: ${APP_RAG_EMBEDDING_API_KEY:}
      base-url: ${APP_RAG_EMBEDDING_BASE_URL:https://api.openai.com/v1}
      model: ${APP_RAG_EMBEDDING_MODEL:text-embedding-3-small}
      timeout: ${APP_RAG_EMBEDDING_TIMEOUT:PT60S}
  ai:
    anthropic:
      # Clé plateforme (mode Hosted). Fournie EXCLUSIVEMENT par l'environnement, jamais commitée
      # ni journalisée. Si vide, le proxy de chat renvoie 503 (fournisseur dormant).
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      version: ${ANTHROPIC_VERSION:2023-06-01}
      # Modèle par défaut + liste blanche des modèles sélectionnables (OQ-04 contournée par config).
      default-model: ${ANTHROPIC_DEFAULT_MODEL:claude-opus-4-8}
      models: ${ANTHROPIC_MODELS:claude-opus-4-8,claude-sonnet-5,claude-haiku-4-5}
      max-tokens: ${ANTHROPIC_MAX_TOKENS:4096}
      timeout: ${ANTHROPIC_TIMEOUT:PT120S}
  byok:
    # Chiffrement des clés API utilisateur (F-03, OQ-06 : AWS KMS envelope encryption).
    # kms-key-id vide => BYOK dormant (l'ajout de clé renvoie 503), sauf si local-key est fourni.
    # Fournis EXCLUSIVEMENT par l'environnement, jamais commités ni journalisés.
    kms-key-id: ${APP_BYOK_KMS_KEY_ID:}
    region: ${APP_BYOK_REGION:eu-west-3}
    # Clé maître LOCALE base64 (AES 256 bits) réservée au dev/tests, jamais en production.
    local-key: ${APP_BYOK_LOCAL_KEY:}
  git:
    # Accès GitHub (F-31). AUCUN secret ici : le jeton appartient à l'utilisateur, il est chiffré en
    # base (mécanisme BYOK) et n'est jamais configuré côté serveur. Seule l'URL de l'API est
    # paramétrable (tests, GitHub Enterprise), avec le délai de la vérification du jeton.
    github-api-url: ${APP_GIT_GITHUB_API_URL:https://api.github.com}
    timeout: ${APP_GIT_TIMEOUT:PT10S}
    # Serveur MCP GitHub (F-31 / SF-31-05, ADR-015) : c'est lui qui expose `create_pull_request`.
    # Valeur PUBLIQUE, non secrète — l'authentification passe par le vault de l'utilisateur, où son
    # PAT est déposé sous cette même URL.
    mcp-server-url: ${APP_GIT_MCP_SERVER_URL:https://api.githubcopilot.com/mcp/}
    mcp-server-name: ${APP_GIT_MCP_SERVER_NAME:github}
  billing:
    # Durée de l'essai gratuit en jours (F-09). Décision réversible : ajustable sans changement de code.
    trial-days: ${APP_BILLING_TRIAL_DAYS:5}
    stripe:
      # Secrets Stripe (F-09) : fournis EXCLUSIVEMENT par l'environnement, jamais commités ni journalisés.
      # Si secret-key est vide, le billing est dormant (checkout => 503), comme la clé Anthropic.
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      # Mapping plan -> price ID Stripe (OQ-07 : externalisé, jamais en dur). Par environnement.
      prices:
        SOLO: ${STRIPE_PRICE_SOLO:}
        PRO: ${STRIPE_PRICE_PRO:}
        DAILY: ${STRIPE_PRICE_DAILY:}
        GOLD: ${STRIPE_PRICE_GOLD:}
      # Mapping pack de tokens (top-up, F-21) -> price ID Stripe (paiement one-shot). Par environnement.
      topup-prices:
        DAY: ${STRIPE_PRICE_TOPUP_DAY:}
        STANDARD: ${STRIPE_PRICE_TOPUP_STANDARD:}
      # Montants d'affichage (EUR) des plans pour la page de facturation (SF-21-05). Non secret ;
      # purement cosmétique (le vrai débit est porté par le price Stripe). Ajustable par environnement.
      display-prices:
        SOLO: ${STRIPE_DISPLAY_PRICE_SOLO:24}
        PRO: ${STRIPE_DISPLAY_PRICE_PRO:99}
        GOLD: ${STRIPE_DISPLAY_PRICE_GOLD:199}
      # URLs de retour Checkout (frontend). Surchargées par environnement.
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/billing?checkout=success}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/billing?checkout=cancel}
  quota:
    # Quotas d'entitlement (F-10) : allocation mensuelle de tokens par état d'abonnement/plan.
    # Valeurs commerciales réversibles, ajustables par environnement sans changement de code.
    # V1 = blocage à la limite (pas d'overage monétisé — OQ-08 ouverte pour la variante payante).
    trial-tokens: ${APP_QUOTA_TRIAL_TOKENS:200000}
    plans:
      SOLO: ${APP_QUOTA_SOLO_TOKENS:1000000}
      PRO: ${APP_QUOTA_PRO_TOKENS:5000000}
      DAILY: ${APP_QUOTA_DAILY_TOKENS:500000}
      GOLD: ${APP_QUOTA_GOLD_TOKENS:12000000}
    # Plafond de temps de bac à sable Managed Agents (F-28 / SF-28-12) par période, en secondes.
    # Défaut 18000 = 5 h. Garde de coût : au-delà, l'exécution Phase 2 est refusée (sandbox_limit).
    max-sandbox-seconds: ${APP_ATELIER_AGENT_MAX_SANDBOX_SECONDS:18000}
  usage:
    report:
      # Rapport d'usage & coût (F-16) : devise, fenêtre d'historique et tarifs estimés.
      # Valeurs commerciales réversibles, ajustables par environnement sans changement de code.
      # Le coût est une ESTIMATION au tarif blended (les compteurs F-10 n'ont pas de ventilation
      # par modèle). Aucun secret. Prix exprimés par million de tokens.
      currency: ${APP_USAGE_CURRENCY:EUR}
      max-months: ${APP_USAGE_MAX_MONTHS:12}
      # Tarifs du modele REELLEMENT servi (Opus : 5 / 25 par million, F-36 / SF-36-03). Ils valaient
      # 3 / 15 — le tarif de Sonnet — et sous-estimaient le cout d'environ 40 %.
      input-cost-per-million-tokens: ${APP_USAGE_INPUT_COST_PER_M:5.00}
      output-cost-per-million-tokens: ${APP_USAGE_OUTPUT_COST_PER_M:25.00}
  oauth2:
    google:
      # Identifiants OAuth2/OIDC Google. Fournis exclusivement par l'environnement.
      # Si client-id est vide, OAuth reste dormant (aucun bean, démarrage normal) — voir OAuth2ClientConfig.
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  jwt:
    # Secret de signature HS256. Fourni exclusivement par l'environnement (aucun défaut en dur).
    # L'application refuse de démarrer si absent ou trop court (< 256 bits) — voir JwtService.
    secret: ${APP_JWT_SECRET:}
    # Durée de validité des tokens (format ISO-8601, ex. PT24H). Défaut : 24h.
    expiration: ${APP_JWT_EXPIRATION:PT24H}
  verification:
    # Durée de validité d'un token de vérification d'e-mail (ISO-8601). Défaut : 24h.
    token-ttl: ${APP_VERIFICATION_TOKEN_TTL:PT24H}
  password-reset:
    # Durée de validité d'un token de réinitialisation de mot de passe (ISO-8601). Défaut : 1h.
    token-ttl: ${APP_PASSWORD_RESET_TOKEN_TTL:PT1H}
  runner:
    # F-38 : durée de vie d'un code d'appairage runner (ISO-8601). Défaut : 5 min.
    pairing-code-ttl: ${APP_RUNNER_PAIRING_CODE_TTL:PT5M}
    # F-38 : durée de vie d'un jeton runner (ISO-8601). Défaut : 30 jours.
    token-ttl: ${APP_RUNNER_TOKEN_TTL:P30D}
    # F-38 / SF-38-02 : registre des connexions runner (D8 / ADR-016). `in-memory` par défaut
    # (dev/tests, un seul pod) ; `pg-notify` en cluster multi-replica (présence diffusée entre les
    # 2 pods par Postgres LISTEN/NOTIFY, canal `runner_presence`, aucun composant d'infra ajouté).
    registry: ${APP_RUNNER_REGISTRY:in-memory}
    # F-38 / SF-38-03 : chemin filesystem du fat-jar `claude-runner.jar` servi par
    # `GET /runner/download`. Vide par défaut → l'endpoint répond 404 `runner_jar_unavailable`
    # (le jar n'est pas empaqueté dans l'image du backend, il est déposé côté déploiement).
    jar-path: ${APP_RUNNER_JAR_PATH:}
    heartbeat:
      # Fenêtre de fraîcheur du dernier heartbeat pour le statut « runner connecté » : au-delà, le
      # runner est considéré déconnecté si le registre ne le voit pas. Adossé à `last_seen_at` (base
      # partagée), ce critère garde le statut correct même quand la socket vit sur l'autre replica.
      stale-after: ${APP_RUNNER_HEARTBEAT_STALE_AFTER:PT90S}
