spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
server:
  port: 8080
  forward-headers-strategy: framework
# F-77 — La configuration des sondes (exposition, groupes liveness/readiness, probes.enabled)
# vit désormais dans `application.yml`, UNE seule fois, pour TOUS les profils. Elle y était
# dupliquée mot pour mot : deux copies, c'est se garantir qu'un jour l'une des deux sera
# corrigée seule. Et la poser dans le profil de base, c'est la faire passer par les tests.
app:
  frontend-url: ${APP_FRONTEND_URL:https://portal.ng-itconsulting.com}
logging:
  level:
    fr.claudegateway: INFO
    liquibase: INFO
