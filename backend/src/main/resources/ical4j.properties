# F-243 / SF-243-01 - ical4j (analyse des agendas iCal de Jarvis).
# Aucune mise a jour de fuseau par le reseau : les VTIMEZONE du flux et les fuseaux embarques suffisent.
net.fortuna.ical4j.timezone.update.enabled=false
# Tolerance : les flux reels (Google, Outlook) ne sont pas toujours stricts.
ical4j.unfolding.relaxed=true
ical4j.parsing.relaxed=true
ical4j.validation.relaxed=true
ical4j.compatibility.outlook=true
ical4j.compatibility.notes=true
