<html lang="fr">
<head>

<title>Visage de Jarvis</title>
<meta name="description" content="F-250 — maquette du visage holographique de Jarvis : nuage de points, fil de fer, lueurs et synchronisation labiale par visèmes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/*
 * F-250 — maquette autonome. Écran unique, sombre, assumé (comme /jarvis) : DESIGN_SYSTEM §23.
 * Jetons : navy #0B1020, orange de la marque #E07B39 / #F0954F, cœur #FFF3E4, attente cyan #5FD4FF,
 * cerveau principal violet #9B7BFF. Polices de la charte : Space Grotesk (HUD), Inter (sous-titres), JetBrains Mono (mesures).
 */
:root {
  color-scheme: dark;
  --cg-navy: #0B1020;
  --cg-cream: #F5EFE6;
  --cg-holo: #E07B39;
  --cg-holo-text: #F0954F;
  --cg-holo-core: #FFF3E4;
  --cg-holo-wait: #5FD4FF;
  --cg-holo-deep: #9B7BFF;
  --acc: var(--cg-holo-text);
  --acc-rgb: 240, 149, 79;
  --acc-dim: rgba(var(--acc-rgb), .35);
  --glass: rgba(11, 16, 32, .72);
  --f-hud: "Space Grotesk", system-ui, sans-serif;
  --f-body: "Inter", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--cg-navy); color: var(--cg-cream); font-family: var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; z-index: 5; }

/* — En-tête — */
.top { top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); pointer-events: none; }
.brand { font: 600 15px var(--f-hud); letter-spacing: .34em; color: var(--acc); text-shadow: 0 0 14px var(--acc-dim); }
.brand small { display: block; margin-top: 5px; font: 400 11px var(--f-mono); letter-spacing: .06em; color: rgba(245, 239, 230, .55); text-shadow: none; }
.state { display: flex; gap: 10px; align-items: center; }
.pill { font: 600 11px var(--f-hud); letter-spacing: .2em; text-transform: uppercase; color: var(--acc); border: 1px solid var(--acc-dim);
  padding: 6px 11px 6px 22px; border-radius: 2px; background: var(--glass); position: relative;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
.pill::before { content: ""; position: absolute; left: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; animation: beat 1.6s ease-in-out infinite; }
.fps { font: 400 11px var(--f-mono); color: rgba(245, 239, 230, .45); }
@keyframes beat { 50% { opacity: .35; } }

/* — Télémétrie (PC) — */
.tele { right: max(16px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); width: 220px; padding: 14px 16px 16px;
  background: var(--glass); border: 1px solid var(--acc-dim); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); pointer-events: none; }
.tele h2 { margin: 0 0 10px; font: 600 10px var(--f-hud); letter-spacing: .24em; text-transform: uppercase; color: rgba(245, 239, 230, .6); }
.vis { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.vis b { font: 600 28px/1 var(--f-hud); color: var(--acc); text-shadow: 0 0 18px var(--acc-dim); white-space: nowrap; }
.vis span { flex: 1; text-align: right; }
.vis span { font: 400 11px var(--f-mono); color: rgba(245, 239, 230, .6); }
.bar { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; margin: 7px 0; font: 400 11px var(--f-mono); color: rgba(245, 239, 230, .7); }
.bar i { display: block; height: 4px; background: rgba(245, 239, 230, .1); position: relative; overflow: hidden; }
.bar i::after { content: ""; position: absolute; inset: 0; transform-origin: left; transform: scaleX(var(--v, 0)); background: var(--acc); box-shadow: 0 0 8px var(--acc); }
.bar.neg i::after { transform-origin: center; transform: scaleX(calc(var(--v, 0) * 1)); }
.src { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(245, 239, 230, .08); font: 400 10.5px/1.5 var(--f-mono); color: rgba(245, 239, 230, .5); }

/* — Sous-titres et frise des visèmes — */
.say { left: 50%; transform: translateX(-50%); bottom: calc(132px + env(safe-area-inset-bottom)); width: min(760px, calc(100% - 32px)); text-align: center; pointer-events: none; }
#subtitle { min-height: 1.5em; font: 500 clamp(16px, 2.3vw, 21px)/1.45 var(--f-body); color: rgba(245, 239, 230, .38); text-wrap: balance; }
#subtitle .w { transition: color .18s var(--ease), text-shadow .18s var(--ease); }
#subtitle .w.said { color: rgba(245, 239, 230, .9); }
#subtitle .w.now { color: var(--cg-holo-core); text-shadow: 0 0 14px var(--acc); }
.say:not(.on) .frise { opacity: 0; }
.frise { transition: opacity .4s var(--ease); position: relative; height: 34px; margin-top: 12px; overflow: hidden;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
.frise::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--cg-holo-core); box-shadow: 0 0 10px var(--acc), 0 0 2px #fff; }
#track { position: absolute; left: 50%; top: 4px; bottom: 4px; will-change: transform; }
#track .v { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
  font: 500 10px var(--f-mono); color: rgba(245, 239, 230, .75); border-left: 1px solid var(--acc-dim); background: linear-gradient(180deg, rgba(var(--acc-rgb), .16), rgba(var(--acc-rgb), .04)); }
#track .v.ferme { background: linear-gradient(180deg, rgba(255, 243, 228, .3), rgba(255, 243, 228, .06)); color: #fff; }
#track .v.sil { background: none; color: rgba(245, 239, 230, .25); }

/* — Commandes — */
.controls { left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; align-items: center; gap: 10px; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 100%; }
button, .chip { font: 600 12px var(--f-hud); letter-spacing: .14em; text-transform: uppercase; color: var(--cg-cream); background: var(--glass);
  border: 1px solid rgba(245, 239, 230, .16); padding: 0 14px; min-height: 40px; border-radius: 2px; cursor: pointer;
  clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  transition: border-color .2s var(--ease), background .2s var(--ease), color .2s var(--ease); }
button:hover { border-color: var(--acc); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: var(--acc); color: #fff; background: linear-gradient(180deg, rgba(var(--acc-rgb), .26), rgba(var(--acc-rgb), .07)); box-shadow: inset 0 0 18px rgba(var(--acc-rgb), .22); }
.styles button { letter-spacing: .08em; text-transform: none; font-weight: 500; font-family: var(--f-body); font-size: 13px; }
.styles button em { font-style: normal; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 0; box-shadow: 0 0 8px currentColor; }
.opt { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; align-items: center; font: 400 12px var(--f-body); color: rgba(245, 239, 230, .7); }
.opt label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
.opt input[type=checkbox] { accent-color: var(--cg-holo); width: 16px; height: 16px; }
#phrase { font: 400 13px var(--f-body); color: var(--cg-cream); background: rgba(11, 16, 32, .6); border: 1px solid rgba(245, 239, 230, .16); padding: 8px 10px; border-radius: 2px; width: min(460px, 100%); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#noGl { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; font: 500 15px var(--f-body); color: rgba(245, 239, 230, .7); }

@media (max-width: 900px) { .tele { display: none; } }
@media (max-width: 560px) {
  .say { bottom: calc(196px + env(safe-area-inset-bottom)); }
  button { padding: 0 10px; letter-spacing: .08em; font-size: 11px; }
  .opt { font-size: 11px; gap: 4px 12px; }
  .styles .long { display: none; }
}
body.shot .controls .opt, body.shot #phrase { display: none; }
</style>

<body>
<div id="stage" aria-hidden="true"></div>
<div id="noGl">Ce navigateur n’affiche pas la 3D (WebGL indisponible) : le produit montrerait l’orbe 2D.</div>

<header class="hud top">
  <div class="brand">JARVIS<small>F-250 · maquette · le visage</small></div>
  <div class="state"><span class="fps" id="fps"></span><span class="pill" id="pill" role="status" aria-live="polite">Repos</span></div>
</header>

<aside class="hud tele" aria-label="Synchronisation labiale">
  <h2>Visème courant</h2>

  <div class="bar"><span>ouverture</span><i id="bOpen"></i></div>
  <div class="bar"><span>étirement</span><i id="bWide"></i></div>
  <div class="bar"><span>arrondi</span><i id="bRound"></i></div>
  <div class="bar"><span>fermeture</span><i id="bPress"></i></div>
  <div class="src" id="src">source : alignement par caractère (simulé comme ElevenLabs « with-timestamps »)</div>
</aside>

<section class="hud say" aria-live="off">

  <div class="frise" aria-hidden="true"><div id="track"></div></div>
</section>

<nav class="hud controls" aria-label="Démonstration">

    <button data-state="ecoute" aria-pressed="false">Écouter</button>
    <button data-state="reflexion" aria-pressed="false">Réfléchir</button>
    <button data-state="repos" aria-pressed="true">Repos</button>

    <button data-style="a" aria-pressed="true"><em style="color:#E07B39"></em>A<span class="long"> · Ambre filaire</span></button>
    <button data-style="b" aria-pressed="false"><em style="color:#5FD4FF"></em>B<span class="long"> · Cyan holographique</span></button>
    <button data-style="c" aria-pressed="false"><em style="color:#FFF3E4"></em>C<span class="long"> · Braise et glace</span></button>
  </div>
  <div class="opt">
    <label for="phrase" class="sr">Phrase à dire</label>
    <input id="phrase" value="Bonjour Monsieur, votre réunion avec EDENRED commence dans dix minutes.">
    <label><input type="checkbox" id="optVoice" checked> Voix du navigateur</label>
    <label><input type="checkbox" id="optAmp"> Repli amplitude (sans alignement)</label>
    <label><input type="checkbox" id="optReduce"> Réduire les animations</label>
  </div>
</nav>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ───────────────────────── Réglages, banc ───────────────────────── */
const Q = new URLSearchParams(location.search);
const SHOT = Q.has('shot');                         // ?shot&state=parole&t=1.9&style=b : image figée et reproductible
const SHOT_T = parseFloat(Q.get('t') || '2');
const FORCE_VIS = Q.get('vis');                    // ?shot&vis=A : un visème tenu (planche des bouches)
const LOW = Q.get('lod') === 'bas' || matchMedia('(max-width: 700px)').matches || (navigator.hardwareConcurrency || 8) <= 4;
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const optReduce = document.getElementById('optReduce');
optReduce.checked = reduceMQ.matches || Q.get('reduit') === '1';
if (SHOT) document.body.classList.add('shot');

function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(250);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const G = (dx, sx, dy, sy) => Math.exp(-(dx * dx) / (sx * sx) - (dy * dy) / (sy * sy));
const damp = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));

/* ───────────────────────── Styles (goût PO) ───────────────────────── */
const STYLES = {
  a: { name: 'Ambre filaire', base: '#E07B39', hot: '#FFF3E4', line: '#E07B39', accent: '#FFC08A', aura: '#E07B39', abyss: '#26170E', text: '#F0954F', lineA: 0.30, pointA: 1.0, scan: 0.7 },
  b: { name: 'Cyan holographique', base: '#5FD4FF', hot: '#E8FBFF', line: '#5FD4FF', accent: '#BDF3FF', aura: '#5FD4FF', abyss: '#0E2340', text: '#5FD4FF', lineA: 0.24, pointA: 1.05, scan: 1.0 },
  c: { name: 'Braise et glace', base: '#E07B39', hot: '#FFF3E4', line: '#5FD4FF', accent: '#FFF3E4', aura: '#E07B39', abyss: '#1B1626', text: '#F0954F', lineA: 0.16, pointA: 1.0, scan: 0.8 },
};
let styleKey = STYLES[Q.get('style')] ? Q.get('style') : 'a';

/* ───────────────────────── Le visage : une surface générique ─────────────────────────
 * Aucune personne réelle : un ovale, des proportions moyennes (règle des tiers), des reliefs gaussiens.
 * Repère : Y vers le haut (front 1,08 → menton −0,74), X latéral, Z vers la caméra. */
const LIP_Y = -0.34;
const EYE = { x: 0.28, y: 0.235, hw: 0.105 };
function halfWidth(Y) {
  if (Y > 0.1) { const k = (Y - 0.1) / 0.98; return k >= 1 ? 0 : 0.76 * Math.pow(1 - Math.pow(k, 2.6), 1 / 2.2); }
  const t = Math.min(1, (0.1 - Y) / 0.84), tail = Math.max(0, t - 0.84) / 0.16;
  return (0.76 - 0.06 * t - 0.42 * Math.pow(t, 2.3)) * Math.sqrt(Math.max(0, 1 - tail * tail));
}
function surfaceZ(X, Y) {
  const W = Math.max(1e-3, halfWidth(Y)), e = Math.min(1, Math.abs(X) / W), ax = Math.abs(X);
  const vf = Y > 0.35 ? 0.4 + 0.6 * Math.sqrt(Math.max(0, 1 - ((Y - 0.35) / 0.76) ** 2)) : (Y < -0.42 ? 0.86 + 0.14 * (1 - sstep(-0.42, -0.74, Y)) : 1);
  let z = 0.6 * vf * Math.pow(Math.max(0, 1 - e * e), 0.5) - 0.1;
  const front = 1 - e ** 4;
  let f = 0;
  f += 0.05 * G(ax - 0.27, 0.2, Y - 0.37, 0.06);                 // arcades
  f -= 0.10 * G(ax - 0.28, 0.15, Y - 0.24, 0.085);               // orbites
  f += 0.05 * G(ax - 0.28, 0.08, Y - 0.235, 0.045);              // globes
  if (Y < 0.34 && Y > -0.26) {                                    // nez : arête qui monte vers la pointe
    const t = clamp((0.30 - Y) / 0.42, 0, 1), h = 0.035 + 0.25 * Math.pow(t, 1.6), s = 0.048 + 0.05 * t;
    const fall = Y > -0.12 ? 1 : Math.exp(-(((Y + 0.12) / 0.035) ** 2));
    f += h * Math.exp(-((X / s) ** 2)) * fall * sstep(0.34, 0.27, Y);
  }
  f += 0.06 * G(ax - 0.085, 0.05, Y + 0.115, 0.04);             // ailes du nez
  f -= 0.014 * G(X, 0.12, Y + 0.22, 0.04);                       // sillon sous le nez
  f += 0.07 * G(X, 0.27, Y - LIP_Y, 0.17);                       // avancée de la bouche
  f += 0.026 * G(X, 0.15, Y - (LIP_Y + 0.026), 0.022);           // lèvre supérieure
  f += 0.032 * G(X, 0.13, Y - (LIP_Y - 0.04), 0.028);            // lèvre inférieure
  f += 0.05 * G(X, 0.14, Y + 0.6, 0.08);                         // menton
  f += 0.05 * G(ax - 0.42, 0.13, Y - 0.03, 0.1);                 // pommettes
  f -= 0.03 * G(ax - 0.42, 0.12, Y + 0.24, 0.12);                // joues
  f -= 0.03 * G(ax - 0.62, 0.1, Y - 0.35, 0.15);                 // tempes
  return z + f * front;
}

/* La bouche : quatre paramètres pilotés par les visèmes. */
const mouth = { open: 0, wide: 0, round: 0, press: 0 };
/** Déforme un point du bas du visage. `above` : le point est au-dessus de la ligne des lèvres (fente). */
function deform(X, Y, Z, above, m, out) {
  const dyL = Y - LIP_Y, mh = 0.165; // demi-largeur au repos : l'étirement est porté par dx
  const xr = X / mh, slit = Math.pow(Math.max(0, 1 - xr * xr), 0.75);
  const open = m.open * (1 - 0.92 * m.press);
  const wm = Math.exp(-(X * X) / 0.1024) * Math.exp(-(dyL * dyL) / 0.0256);
  let dx = X * (0.24 * m.wide - 0.42 * m.round) * wm;
  let dz = (0.075 * m.round - 0.012 * m.press) * Math.exp(-(X * X) / 0.04) * Math.exp(-(dyL * dyL) / 0.0081);
  let dy = 0;
  if (above) {
    dy += open * 0.06 * slit * Math.exp(-(dyL * dyL) / 0.0049);
  } else {
    const lowJaw = Math.exp(-(X * X) / 0.1764) * sstep(0, -0.14, dyL);
    dy -= open * (0.13 * slit * Math.exp(-(dyL * dyL) / 0.0081) + 0.12 * lowJaw);
    dz -= open * 0.04 * lowJaw;
  }
  out[0] = X + dx; out[1] = Y + dy; out[2] = Z + dz;
}

/* ───────────────────────── Rendu ───────────────────────── */
const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: SHOT });
} catch (e) {
  document.getElementById('noGl').style.display = 'grid';
  throw e;
}
const DPR = Math.min(devicePixelRatio || 1, LOW ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.setClearColor(0x0B1020, 1);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 60);
const head = new THREE.Group();
scene.add(head);

/* Fond : lueur d'abysse sous le visage + étoiles fixes. */
const bgMat = new THREE.ShaderMaterial({
  depthWrite: false,
  uniforms: { uNavy: { value: new THREE.Color('#0B1020') }, uAbyss: { value: new THREE.Color(STYLES[styleKey].abyss) }, uGlow: { value: 1 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.9999, 1.0); }`,
  fragmentShader: `uniform vec3 uNavy; uniform vec3 uAbyss; uniform float uGlow; varying vec2 vUv;
    void main(){ vec2 d = vUv - vec2(0.5, 0.52); d.x *= 1.25; float r = length(d);
      vec3 c = mix(uAbyss * (0.85 + 0.25 * uGlow), uNavy, smoothstep(0.0, 0.62, r)); gl_FragColor = vec4(c, 1.0); }`,
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
bg.frustumCulled = false; bg.renderOrder = -10;
scene.add(bg);
{
  const n = LOW ? 260 : 700, p = new Float32Array(n * 3), a = new Float32Array(n);
  for (let i = 0; i < n; i++) { const th = rnd() * Math.PI * 2, r = 6 + rnd() * 10; p[i * 3] = Math.cos(th) * r; p[i * 3 + 1] = (rnd() - 0.5) * 14; p[i * 3 + 2] = -8 - rnd() * 14; a[i] = rnd(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setAttribute('aSeed', new THREE.BufferAttribute(a, 1));
  const m = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: { value: 0 }, uPix: { value: DPR } },
    vertexShader: `attribute float aSeed; uniform float uTime; uniform float uPix; varying float vA;
      void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); gl_Position = projectionMatrix * mv; vA = 0.18 + 0.32 * aSeed * (0.7 + 0.3 * sin(uTime * 0.8 + aSeed * 50.)); gl_PointSize = (1.0 + aSeed * 1.6) * uPix; }`,
    fragmentShader: `varying float vA; void main(){ float d = length(gl_PointCoord - .5); gl_FragColor = vec4(vec3(1.0, .93, .86), vA * smoothstep(.5, .0, d)); }` });
  scene.add(new THREE.Points(g, m));

    elCode.textContent = V.c; elName.textContent = V.n;
  }
  bars.open.style.setProperty('--v', mouth.open.toFixed(3)); bars.wide.style.setProperty('--v', Math.max(0, mouth.wide).toFixed(3));
  bars.round.style.setProperty('--v', mouth.round.toFixed(3)); bars.press.style.setProperty('--v', mouth.press.toFixed(3));
  elSrc.textContent = document.getElementById('optAmp').checked
    ? 'source : niveau sonore seul (repli — voix sans alignement)'
    : 'source : alignement par caractère (simulé comme ElevenLabs « with-timestamps »)';
}

let last = performance.now(), acc = 0, frames = 0;
if (SHOT) {
  const st = Q.get('state') || 'repos';
  if (st === 'parole') speak(); else setState(st);
  for (let t = 0; t < SHOT_T; t += 1 / 60) update(1 / 60);
  composer.render();
  window.__ready = true;
} else {
  requestAnimationFrame(function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!document.hidden) { update(dt); composer.render(); }
    acc += dt; frames++;
    if (acc > 0.5) { elFps.textContent = Math.round(frames / acc) + ' i/s · ' + (LOW ? 'allégé' : 'PC'); acc = 0; frames = 0; }
    requestAnimationFrame(loop);
  });
}
reduceMQ.addEventListener?.('change', e => { optReduce.checked = e.matches; });
</script>
</body>
</html>
