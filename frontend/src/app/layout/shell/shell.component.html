<mat-toolbar class="app-bar">
  <span class="brand" routerLink="/chat">Claude Portal</span>

  <nav class="app-nav">
    <a mat-button routerLink="/chat" routerLinkActive="active">
      <mat-icon>chat</mat-icon>
      Chat
    </a>
    <!-- F-68 / SF-68-01 — une seule entrée pour la Forge. Elle mène à l'accueil de la Forge,
         c'est-à-dire à la vue des missions ; l'entrée « Postes » a disparu, parce que deux onglets
         qui listaient les mêmes projets posaient la question « c'est quoi la différence ? ».
         L'état actif est calculé plutôt que délégué à `routerLinkActive` : travailler dans un
         projet (`/atelier/:id`), c'est toujours être dans la Forge, et la section d'où l'on vient
         ne doit pas s'éteindre pendant qu'on y travaille. -->
    <a mat-button routerLink="/forge" [class.active]="forgeActive()">
      <mat-icon>terminal</mat-icon>
      Forge
    </a>
    <a mat-button routerLink="/gouvernance" routerLinkActive="active">
      <mat-icon>gavel</mat-icon>
      Gouvernance
    </a>
    <a mat-button routerLink="/documents" routerLinkActive="active">
      <mat-icon>library_books</mat-icon>
      Bibliothèque
    </a>
    <a mat-button routerLink="/ask" routerLinkActive="active">
      <mat-icon>help_outline</mat-icon>
      Q&A
    </a>
    <a mat-button routerLink="/templates" routerLinkActive="active">
      <mat-icon>description</mat-icon>
      Templates
    </a>
  </nav>

  <span class="spacer"></span>

  <button
    mat-icon-button
    class="account-trigger"
    [matMenuTriggerFor]="accountMenu"
    aria-label="Compte"
    matTooltip="Compte"
  >
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #accountMenu="matMenu">
    <a mat-menu-item routerLink="/reports">
      <mat-icon>insights</mat-icon>
      <span>Rapports d'usage</span>
    </a>
    <a mat-menu-item routerLink="/billing">
      <mat-icon>credit_card</mat-icon>
      <span>Facturation</span>
    </a>
    <a mat-menu-item routerLink="/settings">
      <mat-icon>settings</mat-icon>
      <span>Réglages</span>
    </a>
    <a mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>Profil</span>
    </a>
    @if (isAdmin()) {
      <a mat-menu-item routerLink="/admin">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>Administration</span>
      </a>
    }
    <button mat-menu-item type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Déconnexion</span>
    </button>
  </mat-menu>
</mat-toolbar>

<app-quota-alert-banner></app-quota-alert-banner>

<main class="app-content">
  <router-outlet></router-outlet>
</main>

<app-help-chat-widget></app-help-chat-widget>
