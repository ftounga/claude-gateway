<mat-toolbar class="app-bar">
  <!-- F-151 / SF-151-01 — Bouton hamburger : masqué ≥ 820 px, il déploie sous 819 px le panneau
       des 7 liens (mêmes liens, un seul jeu). Cible tactile conforme (mat-icon-button = 48 px). -->
  <button
    mat-icon-button
    type="button"
    class="app-nav-toggle"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="app-nav"
    [attr.aria-label]="menuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
    (click)="toggleMenu()"
  >
    <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>

  <span class="brand" routerLink="/chat">Claude Portal</span>

  <!-- F-151 / SF-151-04 — Tapoter un lien referme le panneau replié : (click)="closeMenu()" ferme
       tout de suite, y compris quand le lien mène à la page courante (aucun NavigationEnd ne survient).
       L'effet sur NavigationEnd (shell.component.ts) reste en filet pour les navigations programmatiques.
       Sans effet ≥ 820 px : le menu n'y est pas replié. -->
  <nav id="app-nav" class="app-nav" [class.app-nav--open]="menuOpen()">
    <a mat-button routerLink="/chat" routerLinkActive="active" (click)="closeMenu()">
      <mat-icon>chat</mat-icon>
      Chat
    </a>
    <!-- F-68 / SF-68-01 — une seule entrée pour la Forge. Elle mène à l'accueil de la Forge,
         c'est-à-dire à la vue des missions ; l'entrée « Postes » a disparu, parce que deux onglets
         qui listaient les mêmes projets posaient la question « c'est quoi la différence ? ».
         L'état actif est calculé plutôt que délégué à `routerLinkActive` : travailler dans un
         projet (`/atelier/:id`), c'est toujours être dans la Forge, et la section d'où l'on vient
         ne doit pas s'éteindre pendant qu'on y travaille. -->
    <a mat-button class="app-nav__forge" [routerLink]="spaceLinks().forge" [class.active]="forgeActive()" (click)="closeMenu()">
      <mat-icon>terminal</mat-icon>
      Forge
    </a>
    <!-- F-106 / SF-106-02 — la Vigie, à côté de la Forge : deux espaces, deux métiers. -->
    <a mat-button class="app-nav__vigie" [routerLink]="spaceLinks().vigie" [class.active]="vigieActive()" (click)="closeMenu()">
      <mat-icon>radar</mat-icon>
      Vigie
    </a>
    <a mat-button routerLink="/gouvernance" routerLinkActive="active" (click)="closeMenu()">
      <mat-icon>gavel</mat-icon>
      Gouvernance
    </a>
    <a mat-button routerLink="/documents" routerLinkActive="active" (click)="closeMenu()">
      <mat-icon>library_books</mat-icon>
      Bibliothèque
    </a>
    <a mat-button routerLink="/ask" routerLinkActive="active" (click)="closeMenu()">
      <mat-icon>help_outline</mat-icon>
      Q&A
    </a>
    <a mat-button routerLink="/templates" routerLinkActive="active" (click)="closeMenu()">
      <mat-icon>description</mat-icon>
      Templates
    </a>
  </nav>

  <span class="spacer"></span>

  <button
    mat-icon-button
    class="account-trigger"
    [matMenuTriggerFor]="accountMenu"
    aria-label="Compte"
    matTooltip="Compte"
  >
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #accountMenu="matMenu">
    <a mat-menu-item routerLink="/reports">
      <mat-icon>insights</mat-icon>
      <span>Rapports d'usage</span>
    </a>
    <a mat-menu-item routerLink="/billing">
      <mat-icon>credit_card</mat-icon>
      <span>Facturation</span>
    </a>
    <a mat-menu-item routerLink="/settings">
      <mat-icon>settings</mat-icon>
      <span>Réglages</span>
    </a>
    <a mat-menu-item routerLink="/profile">
      <mat-icon>person</mat-icon>
      <span>Profil</span>
    </a>
    @if (isAdmin()) {
      <a mat-menu-item routerLink="/admin">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>Administration</span>
      </a>
    }
    <button mat-menu-item type="button" (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Déconnexion</span>
    </button>
  </mat-menu>
</mat-toolbar>

<!-- F-151 / SF-151-01 — Voile de fermeture : un clic hors du panneau referme le menu replié.
     Présent seulement quand le menu est ouvert ; masqué ≥ 820 px par le CSS (@media). -->
@if (menuOpen()) {
  <div class="app-nav-backdrop" (click)="closeMenu()"></div>
}

<app-quota-alert-banner></app-quota-alert-banner>

<main class="app-content">
  <router-outlet></router-outlet>
</main>
