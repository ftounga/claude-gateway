<section class="voir" [class.voir--flux]="density() === 'flux'">
  <!-- UNE LIGNE (F-98 / SF-98-04) : d'où l'on vient, où l'on est, et la densité. La mosaïque exige que
       les terminaux prennent l'écran : cette barre est le seul chrome au-dessus d'elle. -->
  <header class="voir__bar">
    <a class="voir__back" routerLink="/forge" aria-label="Retour à la Forge">
      <mat-icon aria-hidden="true">arrow_back</mat-icon>
      Forge
    </a>
    <h1 class="voir__title">Voir travailler</h1>
    <div class="voir__density" role="group" aria-label="Densité">
      @for (option of options; track option.key) {
        <button
          type="button"
          class="voir__option"
          [class.voir__option--active]="density() === option.key"
          [attr.aria-pressed]="density() === option.key"
          [attr.data-density]="option.key"
          (click)="choose(option.key)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </header>

  <div class="voir__screen">
    @if (density() === 'flux') {
      <app-mosaique></app-mosaique>
    } @else {
      <app-supervision></app-supervision>
    }
  </div>
</section>
